<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#004cda" />
    <meta
      name="description"
      content="Fill the numbers 1-6 once in every hexagon, with matching numbers where hexagons touch. A logic puzzle in the spirit of Sudoku and Wordle."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hexile" />
    <meta property="og:title" content="Hexile" />
    <meta
      property="og:description"
      content="Fill the numbers 1-6 once in every hexagon, with matching numbers where hexagons touch. A logic puzzle in the spirit of Sudoku and Wordle."
    />
    <meta property="og:url" content="https://hexile.themantraproject.com/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hexile" />
    <meta
      name="twitter:description"
      content="Fill the numbers 1-6 once in every hexagon, with matching numbers where hexagons touch."
    />

    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hexile" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    %sveltekit.head%
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hexile:theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
