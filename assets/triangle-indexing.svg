<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 180 180" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .hex-fill { fill: #f7f7f7; stroke: #9a9a9a; stroke-width: 2; }
    .tri-line { stroke: #9a9a9a; stroke-width: 1; }
    .tri-num  { fill: #ff9f00; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .centre   { fill: #111111; font-size: 9px; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <polygon class="hex-fill" points="75,0 37.5,-65 -37.5,-65 -75,0 -37.5,65 37.5,65"/>

  <line class="tri-line" x1="0" y1="0" x2="75" y2="0"/>
  <line class="tri-line" x1="0" y1="0" x2="37.5" y2="-65"/>
  <line class="tri-line" x1="0" y1="0" x2="-37.5" y2="-65"/>
  <line class="tri-line" x1="0" y1="0" x2="-75" y2="0"/>
  <line class="tri-line" x1="0" y1="0" x2="-37.5" y2="65"/>
  <line class="tri-line" x1="0" y1="0" x2="37.5" y2="65"/>

  <!-- Triangle labels at the centroid of each triangle -->
  <text class="tri-num" x="0"   y="-43">0</text>
  <text class="tri-num" x="38"  y="-22">1</text>
  <text class="tri-num" x="38"  y="22">2</text>
  <text class="tri-num" x="0"   y="43">3</text>
  <text class="tri-num" x="-38" y="22">4</text>
  <text class="tri-num" x="-38" y="-22">5</text>

  <circle cx="0" cy="0" r="2" fill="#111111"/>
</svg>
