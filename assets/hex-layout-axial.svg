<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -55 260 450" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .hex-fill   { fill: #f7f7f7; stroke: #9a9a9a; stroke-width: 1.5; }
    .tri-line   { stroke: #d9d9d9; stroke-width: 0.75; }
    .id-num     { fill: #111111; font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .axial      { fill: #ff9f00; font-size: 10px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- Flat-top hex: vertices at right, upper-right, upper-left, left, lower-left, lower-right -->
  <symbol id="hex" overflow="visible">
    <polygon class="hex-fill" points="50,0 25,-43.3 -25,-43.3 -50,0 -25,43.3 25,43.3"/>
    <line class="tri-line" x1="0" y1="0" x2="50"  y2="0"/>
    <line class="tri-line" x1="0" y1="0" x2="25"  y2="-43.3"/>
    <line class="tri-line" x1="0" y1="0" x2="-25" y2="-43.3"/>
    <line class="tri-line" x1="0" y1="0" x2="-50" y2="0"/>
    <line class="tri-line" x1="0" y1="0" x2="-25" y2="43.3"/>
    <line class="tri-line" x1="0" y1="0" x2="25"  y2="43.3"/>
  </symbol>

  <g transform="translate(0, 0)">      <use href="#hex"/><text class="id-num" y="-4">1</text> <text class="axial" y="14">(0, 0)</text></g>
  <g transform="translate(-75, 43.3)"> <use href="#hex"/><text class="id-num" y="-4">2</text> <text class="axial" y="14">(-1, 1)</text></g>
  <g transform="translate(75, 43.3)">  <use href="#hex"/><text class="id-num" y="-4">3</text> <text class="axial" y="14">(1, 0)</text></g>
  <g transform="translate(0, 86.6)">   <use href="#hex"/><text class="id-num" y="-4">4</text> <text class="axial" y="14">(0, 1)</text></g>
  <g transform="translate(-75, 129.9)"><use href="#hex"/><text class="id-num" y="-4">5</text> <text class="axial" y="14">(-1, 2)</text></g>
  <g transform="translate(75, 129.9)"> <use href="#hex"/><text class="id-num" y="-4">6</text> <text class="axial" y="14">(1, 1)</text></g>
  <g transform="translate(0, 173.2)">  <use href="#hex"/><text class="id-num" y="-4">7</text> <text class="axial" y="14">(0, 2)</text></g>
  <g transform="translate(-75, 216.5)"><use href="#hex"/><text class="id-num" y="-4">8</text> <text class="axial" y="14">(-1, 3)</text></g>
  <g transform="translate(75, 216.5)"> <use href="#hex"/><text class="id-num" y="-4">9</text> <text class="axial" y="14">(1, 2)</text></g>
  <g transform="translate(0, 259.8)">  <use href="#hex"/><text class="id-num" y="-4">10</text><text class="axial" y="14">(0, 3)</text></g>
  <g transform="translate(-75, 303.1)"><use href="#hex"/><text class="id-num" y="-4">11</text><text class="axial" y="14">(-1, 4)</text></g>
  <g transform="translate(75, 303.1)"> <use href="#hex"/><text class="id-num" y="-4">12</text><text class="axial" y="14">(1, 3)</text></g>
  <g transform="translate(0, 346.4)">  <use href="#hex"/><text class="id-num" y="-4">13</text><text class="axial" y="14">(0, 4)</text></g>
</svg>
